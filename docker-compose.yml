services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: on-failure
    env_file: .env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    build: ./requirements/phpmyadmin
    container_name: phpmyadmin
    restart: on-failure
    depends_on:
      - mariadb
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: on-failure
    env_file: .env
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - PMA_DOMAIN=${PMA_DOMAIN}
    ports:
      - "443:443"
      - "80:80"
    networks:
      - inception
    depends_on:
      - wordpress
      - phpmyadmin
    volumes:
      - wordpress_data:/var/www/wordpress
      - ./ssl:/etc/nginx/ssl:ro

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: on-failure
    env_file: .env
    networks:
      - inception
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/wordpress

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  wordpress_data:
    driver: local