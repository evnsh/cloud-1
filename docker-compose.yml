services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: on-failure
    env_file: .env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email me@evan.sh --agree-tos --no-eff-email -d cloud1.evan.sh

  phpmyadmin:
    build: ./requirements/phpmyadmin
    container_name: phpmyadmin
    restart: on-failure
    depends_on:
      - mariadb
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: on-failure
    env_file: .env
    ports:
      - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress
      - phpmyadmin
      - certbot
    volumes:
      - wordpress_data:/var/www/wordpress
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: on-failure
    env_file: .env
    networks:
      - inception
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/wordpress

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  wordpress_data:
    driver: local
  letsencrypt:
    driver: local
  certbot_www:
    driver: local