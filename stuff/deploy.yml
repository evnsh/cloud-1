---
- name: Deploy containers with Docker and Caddy for TLS
  hosts: servers
  become: yes
  vars:
    caddy_domain: "cloud1.evan.sh"  # Update with your domain
    caddy_email: "spam@evan.sh"  # Update with your email

  tasks:
    - name: Install Docker dependencies
      apt:
        name: 
          - docker.io
          - docker-compose
          - python3-pip
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create /opt/deployment directory
      file:
        path: /opt/deployment
        state: directory
        mode: '0755'

    - name: Copy the entire requirements directory to the server
      synchronize:
        src: ./requirements/
        dest: /opt/deployment/requirements/
        mode: push
        recursive: yes
        delete: no

    - name: Copy the environment file to the server
      synchronize:
        src: .env
        dest: /opt/deployment/.env
        mode: push
        recursive: no
        delete: no
      
    - name: Copy the docker-compose file to the server
      synchronize:
        src: docker-compose.yml
        dest: /opt/deployment/docker-compose.yml
        mode: push
        recursive: no
        delete: no
      
    - name: Ensure the necessary directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/deployment/requirements/wordpress/conf
        - /opt/deployment/requirements/mariadb/conf
        - /opt/deployment/requirements/nginx/conf
        - /opt/deployment/requirements/phpmyadmin/conf

    - name: Configure MariaDB persistence
      copy:
        src: ./requirements/mariadb/conf/my.cnf
        dest: /opt/deployment/requirements/mariadb/conf/my.cnf
        mode: '0644'

    - name: Configure Nginx persistence
      copy:
        src: ./requirements/nginx/conf/nginx.conf
        dest: /opt/deployment/requirements/nginx/conf/nginx.conf
        mode: '0644'

    - name: Configure phpMyAdmin persistence
      copy:
        src: ./requirements/phpmyadmin/conf/config.inc.php
        dest: /opt/deployment/requirements/phpmyadmin/conf/config.inc.php
        mode: '0644'

    - name: Copy WordPress initialization script
      copy:
        src: ./requirements/wordpress/tools/init_wp.sh
        dest: /opt/deployment/requirements/wordpress/tools/init_wp.sh
        mode: '0755'

    - name: Copy MariaDB initialization script
      copy:
        src: ./requirements/mariadb/tools/init_db.sh
        dest: /opt/deployment/requirements/mariadb/tools/init_db.sh
        mode: '0755'

    - name: Deploy with docker-compose
      docker_compose:
        project_src: /opt/deployment
        restarted: yes
        state: present

    - name: Open necessary ports in the firewall
      ufw:
        rule: allow
        name: "{{ item }}"
      loop:
        - "22/tcp"
        - "80/tcp"
        - "443/tcp"
        
    - name: Disable all other ports in the firewall
      ufw:
        state: enabled
        default: deny

