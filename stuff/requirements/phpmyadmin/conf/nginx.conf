# This is the top-level configuration block for Nginx
user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

# The events block (usually doesn't require modifications)
events {
    worker_connections 1024;
}

# The http block, which contains the server block
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings (optional)
    access_log  /var/log/nginx/access.log;

    # Basic HTTP configuration
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;

    # The server block for phpMyAdmin
    server {
        listen 80;
        server_name localhost;

        root /var/www/phpmyadmin;
        index index.php index.html;

        # Main location block for serving phpMyAdmin
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Location block to handle PHP files
        location ~ ^/index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Location block for handling PHP requests
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
